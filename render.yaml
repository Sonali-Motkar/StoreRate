databases:
  - name: storerate-postgres
    databaseName: storerate
    user: storerate
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: storerate-app
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: storerate-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Sonal Motkar Platform Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
